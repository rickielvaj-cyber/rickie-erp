name: Backup database

# Backup mingguan Supabase (free tier tidak punya backup otomatis): database (job `backup`) dan file lampiran
# di Storage (job `attachments`). Hasilnya terenkripsi (AES-256) dan disimpan sebagai artifact. Repo ini PUBLIK,
# jadi dump atau file mentah tidak boleh keluar dari langkah yang mengenkripsinya, dan log hanya boleh berisi angka.
# Pengaturan satu kali dan cara restore: docs/BACKUP.md

on:
  schedule:
    - cron: "0 20 * * 0" # Minggu 20:00 UTC = Senin 03:00 WIB
  workflow_dispatch: # tombol "Run workflow" untuk uji manual

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Server Supabase memakai PostgreSQL 17; pg_dump harus versi yang sama atau lebih baru.
      - name: Pasang klien PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump dan enkripsi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          ./scripts/backup.sh "out/backup-$(date -u +%F).sql.gz.gpg"

      - name: Simpan artifact (terenkripsi)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: out/*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error

  # Dua job terpisah: kegagalan satu tidak membatalkan yang lain (mis. kunci Storage belum dipasang tidak boleh
  # menghentikan backup database).
  attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci --ignore-scripts

      # Mengunduh semua file lampiran, mengemas, lalu mengenkripsi dengan passphrase yang sama dengan backup database.
      # Gagal (kode 1) bila ada file hilang/rusak atau ukuran total melewati batas, tetapi yang berhasil tetap dikemas.
      - name: Unduh, kemas, dan enkripsi lampiran
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup-attachments.sh "out/attachments-$(date -u +%F).tar.gz.gpg"

      - name: Simpan artifact (terenkripsi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachments-${{ github.run_id }}
          path: out/attachments-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: ignore
